    <!-- FAQ Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Que veut dire « Syntonera » ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Syntonera réunit l'idée de syntonie (être en harmonie avec soi et son environnement) et celle d'era (une nouvelle étape). C'est une invitation à participer à des événements bien-être conçus pour ralentir, se recentrer et cultiver une harmonie intérieure durable."
          }
        },
        {
          "@type": "Question",
          "name": "Quelle est l'approche de Syntonera ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Notre approche est holistique : corps, esprit, émotions, lien aux autres et à l'environnement. Chaque expérience offre une parenthèse hors du temps, conçue pour vous permettre de relâcher la pression et d'être présent à vous-même."
          }
        },
        {
          "@type": "Question",
          "name": "Qui organise et anime les expériences ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Syntonera collabore avec des intervenants sélectionnés pour leur capacité à créer un véritable cocon propice au lâcher-prise ainsi que leur expertise : artistes, facilitateurs, et partenaires culinaires."
          }
        },
        {
          "@type": "Question",
          "name": "Où ont lieu les événements Syntonera ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Les expériences se déroulent dans des lieux choisis pour favoriser la présence (calme, nature, esthétique, confort). La localisation exacte, l'accès et les infos pratiques sont indiqués sur chaque page d'événement."
          }
        },
        {
          "@type": "Question",
          "name": "Comment proposer mon profil pour intervenir lors d'un événement Syntonera ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ce qui rend nos événements uniques, c'est l'énergie et le cœur que chaque intervenant y apporte. Si notre approche vous parle et que vous souhaitez partager vos compétences au sein d'une expérience Syntonera, nous vous invitons à nous envoyer votre profil via notre espace contact ou directement à contact@syntonera.fr. Nous prenons le temps de lire chaque message avec attention et revenons vers vous si une belle collaboration semble possible."
          }
        }
      ]
    }
    </script>
